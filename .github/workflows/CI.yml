name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Log-density check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          # The manifests under src/models are resolved for this Julia version.
          version: '1.13'
      - uses: julia-actions/cache@v2
      - name: Install the test driver's packages
        run: julia --project=test -e 'using Pkg; Pkg.instantiate()'
      - name: Check every model against Stan's log density
        run: julia --project=test test/runtests.jl
